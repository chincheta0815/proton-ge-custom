name: _job_build

on:
  workflow_call:
    inputs:
      name:
        required: true
        type: string

jobs:
  proton:
    name: Build ${{ inputs.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup disk space
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_codeql: true
          remove_docker_images: true
          remove_swap: true
          remove_packages: |
            azure-cli google-cloud-cli google-chrome-stable firefox microsoft-edge-stable
            postgresql* mysql* php* temurin-* *llvm* mono-devel powershell dotnet-sdk-*
          remove_folders: |
            /usr/share/swift /usr/share/miniconda /usr/local/lib/node_modules
            /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia*
            /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle /usr/share/az*
            /usr/local/.ghcup

      - name: Prepare host
        run: sudo apt update && sudo apt-get install -y ccache fontforge-nox

      - name: Restore cache
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: ccache-proton-${{ github.run_id }}
          restore-keys: |
            ccache-proton

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: false

      - name: Patch
        run: |
          git submodule update --init --filter=tree:0 --recursive
          # apply proton-ge-custom patches
          ./patches/protonprep-valve-staging.sh || true

      - name: Add WineASIO
        working-directory: ./wine
        run: |
          patch -p0 < ../asio-dlls/patches/wine-wine-inf-in.patch

      - name: Create dir structure
        run: |
          mkdir ./build

      - name: Configure build proton
        working-directory: ./build
        run: |
          ../configure.sh --build-name=${{ inputs.name }} --enable-ccache

      - name: Make ${{ inputs.name }}
        working-directory: ./build
        run: |
          make -j$(nproc) dist

      - name: Rename directory
        working-directory: ./build/
        run: |
          mv dist ${{ inputs.name }}

      - name: Move files to their right folder
        working-directory: ./build/${{ inputs.name }}/protonfixes/
        run: |
          mv cabextract ../files/bin/ && \
          mv libmspack.so.0 ../files/lib64/ && \
          mv libmspack.so.0.1.0 ../files/lib64/ && \
          rm cabextract_1.9-1.debian.tar.xz libmspack_0.10.1-1.debian.tar.xz

      - name: Archive build
        working-directory: ./build/
        run: |
          tar -czvf ${{ inputs.name }}.tar.gz ${{ inputs.name }}

      - name: Create sha256sum
        working-directory: ./build/
        run: |
          sha512sum ${{ inputs.name }}.tar.gz > ${{ inputs.name }}.sha512sum

      - name: Save cache
        id: ccache-save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: ${{ steps.ccache-restore.outputs.cache-primary-key }}

      - name: Upload artifact ${{ inputs.name }}.tar.gz
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.tar.gz
          path: ./build/${{ inputs.name }}.tar.gz

      - name: Upload artifact ${{ inputs.name }}.sha512sum
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.name }}.sha512sum
          path: ./build/${{ inputs.name }}.sha512sum

